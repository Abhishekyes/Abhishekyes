<svg width="1200" height="300" viewBox="0 0 1200 300" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f0c29"/>
      <stop offset="45%" stop-color="#302b63"/>
      <stop offset="100%" stop-color="#1b1440"/>
    </linearGradient>
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#8A2BE2"/>
      <stop offset="50%" stop-color="#FF00C8"/>
      <stop offset="100%" stop-color="#00F5FF"/>
      <animate attributeName="x1" values="-20%;120%;-20%" dur="6s" repeatCount="indefinite"/>
      <animate attributeName="x2" values="80%;220%;80%" dur="6s" repeatCount="indefinite"/>
    </linearGradient>
    <linearGradient id="waveGradA" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00c6ff" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#8A2BE2" stop-opacity="0.55"/>
    </linearGradient>
    <linearGradient id="waveGradB" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FF00C8" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#00F5FF" stop-opacity="0.35"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="300" fill="url(#bgGrad)"/>

  <g fill="#ffffff">
    <circle cx="80" cy="45" r="1.6" opacity="0.7"><animate attributeName="opacity" values="0.15;0.9;0.15" dur="2.6s" repeatCount="indefinite"/></circle>
    <circle cx="180" cy="90" r="1.2" opacity="0.5"><animate attributeName="opacity" values="0.1;0.8;0.1" dur="3.4s" repeatCount="indefinite"/></circle>
    <circle cx="300" cy="40" r="1.8" opacity="0.6"><animate attributeName="opacity" values="0.2;1;0.2" dur="3s" repeatCount="indefinite"/></circle>
    <circle cx="420" cy="70" r="1.3" opacity="0.5"><animate attributeName="opacity" values="0.15;0.85;0.15" dur="4s" repeatCount="indefinite"/></circle>
    <circle cx="560" cy="35" r="1.5" opacity="0.6"><animate attributeName="opacity" values="0.2;0.9;0.2" dur="2.8s" repeatCount="indefinite"/></circle>
    <circle cx="700" cy="80" r="1.4" opacity="0.55"><animate attributeName="opacity" values="0.1;0.9;0.1" dur="3.6s" repeatCount="indefinite"/></circle>
    <circle cx="830" cy="45" r="1.7" opacity="0.6"><animate attributeName="opacity" values="0.2;1;0.2" dur="3.1s" repeatCount="indefinite"/></circle>
    <circle cx="950" cy="90" r="1.2" opacity="0.5"><animate attributeName="opacity" values="0.15;0.8;0.15" dur="3.9s" repeatCount="indefinite"/></circle>
    <circle cx="1080" cy="50" r="1.6" opacity="0.65"><animate attributeName="opacity" values="0.2;0.95;0.2" dur="2.7s" repeatCount="indefinite"/></circle>
    <circle cx="1150" cy="100" r="1.3" opacity="0.5"><animate attributeName="opacity" values="0.1;0.85;0.1" dur="3.3s" repeatCount="indefinite"/></circle>
  </g>

  <path fill="url(#waveGradB)">
    <animate attributeName="d" dur="7s" repeatCount="indefinite"
      values="M0,240 C250,200 450,270 700,235 C900,205 1050,245 1200,225 L1200,300 L0,300 Z;
              M0,230 C250,265 450,195 700,245 C900,225 1050,200 1200,240 L1200,300 L0,300 Z;
              M0,240 C250,200 450,270 700,235 C900,205 1050,245 1200,225 L1200,300 L0,300 Z"/>
  </path>

  <path fill="url(#waveGradA)">
    <animate attributeName="d" dur="5.5s" repeatCount="indefinite"
      values="M0,260 C300,225 600,285 900,255 C1000,245 1100,265 1200,255 L1200,300 L0,300 Z;
              M0,255 C300,285 600,220 900,265 C1000,255 1100,235 1200,265 L1200,300 L0,300 Z;
              M0,260 C300,225 600,285 900,255 C1000,245 1100,265 1200,255 L1200,300 L0,300 Z"/>
  </path>

  <text x="600" y="135" font-family="'Segoe UI', Arial, sans-serif" font-size="46" font-weight="700" fill="url(#textGrad)" text-anchor="middle">
    Hi there, I'm Abhishek
    <animate attributeName="opacity" values="0;1" dur="1.2s" begin="0s" fill="freeze"/>
  </text>

  <text x="600" y="180" font-family="'Segoe UI', Arial, sans-serif" font-size="21" fill="#d6d9f5" text-anchor="middle" opacity="0">
    Data Scientist &#8226; GenAI &amp; Agentic AI Engineer
    <animate attributeName="opacity" values="0;1" dur="1.2s" begin="0.6s" fill="freeze"/>
  </text>

  <text x="600" y="215" font-family="'Segoe UI', Arial, sans-serif" font-size="15" fill="#9aa0c9" text-anchor="middle" opacity="0">
    Building RAG pipelines &#8226; LLM Agents &#8226; Data Products
    <animate attributeName="opacity" values="0;1" dur="1.2s" begin="1.1s" fill="freeze"/>
  </text>
</svg>
